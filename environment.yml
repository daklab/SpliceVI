# Conda environment with the package versions the paper's models were trained and evaluated with.
#
#   conda env create -f environment.yml
#   conda activate splicevi-env
#
# torch 2.4.1 is built here for CUDA 12.1; on a machine without a GPU, or with a GPU that needs a newer CUDA,
# install a matching torch build first (https://pytorch.org/get-started/locally/) and then `pip install -e .`.
# The package itself also works with newer versions (tested with torch 2.15, numpy 2.5, pandas 3.1, scvi-tools 1.4.3).
name: splicevi-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.1
      - scvi-tools==1.4.1
      - lightning==2.6.0
      - anndata==0.12.6
      - mudata==0.3.2
      - numpy==1.26.4
      - scipy==1.16.3
      - pandas==2.3.3
      - scikit-learn==1.8.0
      - pytest
      - -e .
