# Runs the test suite on CPU for every push and pull request.
# The tests build their own small random data; the optional checkpoint tests are skipped here.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]   # scvi-tools 1.4 needs Python 3.11 or newer

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install SpliceVI with the test dependencies
        run: pip install ".[test]"

      - name: Run the tests
        run: pytest -q
